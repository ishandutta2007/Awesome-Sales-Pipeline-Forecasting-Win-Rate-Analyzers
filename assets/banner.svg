<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#14112e"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.12"/>
    </pattern>

    <style>
      @keyframes flowWave {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes beamMove {
        0% { transform: translateX(-100px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      .anim-wave {
        stroke-dasharray: 24 12;
        animation: flowWave 30s linear infinite;
      }
      .anim-pulse {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .anim-float {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-card1 { animation: floatCard 5s ease-in-out infinite; }
      .anim-card2 { animation: floatCard 6s ease-in-out infinite 0.7s; }
      .anim-card3 { animation: floatCard 5.5s ease-in-out infinite 1.4s; }
      .anim-card4 { animation: floatCard 6.2s ease-in-out infinite 2.1s; }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Subtle Dynamic Ambient Glows (Strictly in Background) -->
  <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.12" filter="url(#neonGlow)" class="anim-pulse"/>
  <circle cx="1020" cy="140" r="160" fill="#9333ea" opacity="0.12" filter="url(#neonGlow)" class="anim-pulse" style="animation-delay: -2s;"/>

  <!-- Background Dynamic Pipeline Wave Chart -->
  <g opacity="0.55">
    <!-- Area under curve -->
    <path d="M 0 350 Q 250 340 450 270 T 800 210 T 1200 130 L 1200 420 L 0 420 Z" fill="url(#areaGrad)"/>
    <!-- Forecasting Primary Trajectory -->
    <path d="M 0 350 Q 250 340 450 270 T 800 210 T 1200 130" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" class="anim-wave"/>
    <!-- Projected Uncertainty Fan Lines -->
    <path d="M 800 210 Q 1000 160 1200 80" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.6"/>
    <path d="M 800 210 Q 1000 220 1200 200" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.6"/>
  </g>

  <!-- Pipeline Milestone Markers (Subtle background data nodes) -->
  <g opacity="0.75">
    <circle cx="450" cy="270" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="450" cy="270" r="11" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" class="anim-pulse"/>

    <circle cx="800" cy="210" r="6" fill="#818cf8" filter="url(#neonGlow)"/>
    <circle cx="800" cy="210" r="14" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" class="anim-pulse" style="animation-delay: -1s;"/>

    <circle cx="1080" cy="155" r="5" fill="#ec4899" filter="url(#neonGlow)"/>
    <circle cx="1080" cy="155" r="12" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.4" class="anim-pulse" style="animation-delay: -2s;"/>
  </g>

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="360" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" class="font-sans" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.2">
      REVENUE OPERATIONS &amp; PIPELINE ML
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(60, 130)">
    <text class="font-sans" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#cardShadow)">
      Sales Pipeline Forecasting
    </text>
    <text y="54" class="font-sans" font-size="42" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      &amp; Win-Rate Analyzers
    </text>
  </g>

  <!-- Subtitle (Clear, High Contrast Foreground) -->
  <g transform="translate(60, 230)">
    <text class="font-sans" font-size="16.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Ecosystem of Revenue Intelligence, Deal Risk Scoring &amp; Quota Modeling Platforms
    </text>
    <text y="24" class="font-sans" font-size="14" font-weight="400" fill="#94a3b8">
      Tracking Enterprise SaaS Leaders, Open-Source Self-Hosted Engines &amp; ML Time-Series Frameworks
    </text>
  </g>

  <!-- Interactive Highlight Feature Cards / Pills (Across Bottom) -->
  <!-- Card 1: Deal Risk Scoring -->
  <g transform="translate(60, 310)" class="anim-card1">
    <rect width="250" height="58" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="4" height="26" x="12" y="16" rx="2" fill="#38bdf8"/>
    <text x="26" y="29" class="font-sans" font-size="13" font-weight="700" fill="#f8fafc">Deal Risk Scoring</text>
    <text x="26" y="47" class="font-sans" font-size="11" font-weight="500" fill="#94a3b8">Buyer Signals &amp; Slippage AI</text>
  </g>

  <!-- Card 2: Quota & Bias Reconciliation -->
  <g transform="translate(330, 310)" class="anim-card2">
    <rect width="260" height="58" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="4" height="26" x="12" y="16" rx="2" fill="#818cf8"/>
    <text x="26" y="29" class="font-sans" font-size="13" font-weight="700" fill="#f8fafc">Quota &amp; Bias Blending</text>
    <text x="26" y="47" class="font-sans" font-size="11" font-weight="500" fill="#94a3b8">Sandbagging &amp; Quota Cascades</text>
  </g>

  <!-- Card 3: Conversation Intelligence -->
  <g transform="translate(610, 310)" class="anim-card3">
    <rect width="260" height="58" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="4" height="26" x="12" y="16" rx="2" fill="#c084fc"/>
    <text x="26" y="29" class="font-sans" font-size="13" font-weight="700" fill="#f8fafc">Conversation Intelligence</text>
    <text x="26" y="47" class="font-sans" font-size="11" font-weight="500" fill="#94a3b8">BANT/MEDDIC &amp; Call Analytics</text>
  </g>

  <!-- Card 4: Open-Source Sovereignty -->
  <g transform="translate(890, 310)" class="anim-card4">
    <rect width="250" height="58" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="4" height="26" x="12" y="16" rx="2" fill="#10b981"/>
    <text x="26" y="29" class="font-sans" font-size="13" font-weight="700" fill="#f8fafc">Open-Source Sovereignty</text>
    <text x="26" y="47" class="font-sans" font-size="11" font-weight="500" fill="#94a3b8">Self-Hosted No-Per-Seat ML</text>
  </g>

</svg>
